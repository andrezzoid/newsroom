# Run at --minAlertLevel=warning by ../test.sh: vale test's alerts don't show
# their level, so these cases see only the warning- and error-level ones.

- name: every warning rule reaches warning
  input: |
    They are design material, not decoration.

    We delve into it.

    Eviction serves as a safety net.

    It really works.

    The tell: the test breaks when you refactor.

    The file was written by the hook.
  contains:
    - Newsroom.NegativeParallelisms
    - Newsroom.AIVocabulary
    - Newsroom.Copulatives
    - Newsroom.Adverbs
    - Newsroom.BoldLabels
    - Newsroom.Passive
