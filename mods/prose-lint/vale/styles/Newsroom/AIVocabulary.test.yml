- name: GPT-4 era words
  rule: AIVocabulary.yml
  input: We delve into the intricate interplay.
  want: |
    1:4:Newsroom.AIVocabulary:AI vocabulary: replace 'delve' with a plainer word.
    1:19:Newsroom.AIVocabulary:AI vocabulary: replace 'intricate' with a plainer word.
    1:29:Newsroom.AIVocabulary:AI vocabulary: replace 'interplay' with a plainer word.

- name: one word raises one alert
  about: AiTells.Adverb also held "genuinely"; through the config, only AIVocabulary flags it.
  input: Each ticket genuinely gates the next.
  want: |
    1:13:Newsroom.AIVocabulary:AI vocabulary: replace 'genuinely' with a plainer word.

- name: underscore as a verb
  rule: AIVocabulary.yml
  input: This underscores its importance, and the report underscored the risk.
  contains:
    - "'underscores its'"
    - "'underscored the'"

- name: underscore as the character
  rule: AIVocabulary.yml
  input: Names hold letters, digits, underscores and hyphens. Use an underscore.
  want: ''

- name: the words the noise test found outside Wikipedia's lists
  rule: AIVocabulary.yml
  input: A genuine, meaningful and actionable fix runs seamlessly, notably here.
  contains:
    - "'genuine'"
    - "'meaningful'"
    - "'actionable'"
    - "'seamlessly'"
    - "'notably'"

- name: boasts a is the alert of Copulatives
  about: One word raises one alert.
  input: The town boasts a vibrant scene, and it boasts vibrant parks.
  want: |
    1:10:Newsroom.Copulatives:Avoidance of basic copulatives: replace 'boasts a' with "is", "are" or "has".
    1:19:Newsroom.AIVocabulary:AI vocabulary: replace 'vibrant' with a plainer word.
    1:41:Newsroom.AIVocabulary:AI vocabulary: replace 'boasts' with a plainer word.
    1:48:Newsroom.AIVocabulary:AI vocabulary: replace 'vibrant' with a plainer word.

- name: the user's own terms
  input: Use the ubiquitous language of the glossary.
  absent: Newsroom.AIVocabulary
