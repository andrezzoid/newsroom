- name: GPT-4 era words
  rule: AIVocabulary.yml
  input: We delve into the intricate interplay.
  want: |
    1:4:Newsroom.AIVocabulary:'delve' reads as AI: use a plainer word.
    1:19:Newsroom.AIVocabulary:'intricate' reads as AI: use a plainer word.
    1:29:Newsroom.AIVocabulary:'interplay' reads as AI: use a plainer word.

- name: one word raises one alert
  about: AiTells.Adverb also held "genuinely"; through the config, only AIVocabulary flags it.
  input: Each ticket genuinely gates the next.
  want: |
    1:13:Newsroom.AIVocabulary:'genuinely' reads as AI: use a plainer word.

- name: underscore as a verb
  rule: AIVocabulary.yml
  input: This underscores its importance, and the report underscored the risk.
  contains:
    - "'underscores its'"
    - "'underscored the'"

- name: underscore as the character
  rule: AIVocabulary.yml
  input: Names hold letters, digits, underscores and hyphens. Use an underscore.
  want: ''

- name: the words the noise test found outside Wikipedia's lists
  rule: AIVocabulary.yml
  input: A genuine, meaningful and actionable fix runs seamlessly, notably here.
  contains:
    - "'genuine'"
    - "'meaningful'"
    - "'actionable'"
    - "'seamlessly'"
    - "'notably'"

- name: boasts a is the alert of Copulatives
  about: One word raises one alert.
  input: The town boasts a vibrant scene, and it boasts vibrant parks.
  want: |
    1:10:Newsroom.Copulatives:'boasts a' avoids "is": use "is", "are" or "has".
    1:19:Newsroom.AIVocabulary:'vibrant' reads as AI: use a plainer word.
    1:41:Newsroom.AIVocabulary:'boasts' reads as AI: use a plainer word.
    1:48:Newsroom.AIVocabulary:'vibrant' reads as AI: use a plainer word.

- name: the user's own terms
  input: Use the ubiquitous language of the glossary.
  absent: Newsroom.AIVocabulary

- name: key as a noun
  about: Software prose names keys all the time; only the adjective is AI vocabulary.
  rule: AIVocabulary.yml
  input: Use the API key, and the `tabs` key holds the cache key.
  want: ''

- name: key as an adjective
  rule: AIVocabulary.yml
  input: Answer the key questions and make the key point first.
  want: |
    1:12:Newsroom.AIVocabulary:'key' reads as AI: use a plainer word.
    1:39:Newsroom.AIVocabulary:'key' reads as AI: use a plainer word.

- name: leverage, a term of the user's design vocabulary
  about: accept.txt lists it, as it does "seam" from the same glossary.
  input: Depth gives callers leverage at the interface.
  absent: Newsroom.AIVocabulary
