- name: a ", never X" tag after a claim
  rule: NeverTag.yml
  input: The log keeps the hash, never the account number itself.
  want: |
    1:23:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.

- name: a ", never X" tag after a place
  rule: NeverTag.yml
  input: Tests live at seams, never against internals.
  contains: Newsroom.NeverTag

- name: an infinitive after never
  about: AiTells.NeverTag leaves ", never to" alone.
  rule: NeverTag.yml
  input: She left, never to return.
  want: ''

- name: a tag after a mid-sentence when, after, before or once
  about: An exemption for conditions hid these; AiTells.NeverTag flags all five.
  rule: NeverTag.yml
  input: |
    Keep the hash when you log a request, never the account number itself.

    Store the token after login, never the password.

    The hook runs after each Write, never on Read.

    It runs once, never twice.

    The cache refreshes before each request, never in the background.
  want: |
    1:37:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
    3:28:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
    5:31:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
    7:13:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
    9:40:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
