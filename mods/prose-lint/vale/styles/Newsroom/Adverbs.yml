# From AiTells.Adverb (see NOTICE). The user's "no adverbs: an adverb usually
# means the verb is weak". "genuinely", "notably", "quietly" and "seamlessly"
# are AIVocabulary's, so one word raises one alert.
extends: existence
message: "Filler adverb '%s': cut it or use a stronger verb."
level: warning
ignorecase: true
tokens:
  - simply
  - actually
  - really
  - very
  - basically
  - literally
  - structurally
  - precisely
  - exactly
  - merely
  - truly
  - clearly
  - obviously
  - essentially
  - virtually
  - generally
  - currently
  - quickly
  - easily
  - just
  - robustly
  - arguably
  - somewhat
  - fairly
  - seemingly
  - importantly
  - honestly
  - frankly
  - candidly
  - carefully
  - thoughtfully
  - properly
  - effortlessly
  - cleanly
  - transparently
  - authentically
