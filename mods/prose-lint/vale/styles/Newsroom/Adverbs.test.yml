- name: a filler adverb
  rule: Adverbs.yml
  input: It really works.
  want: |
    1:4:Newsroom.Adverbs:Filler adverb 'really': cut it or use a stronger verb.

- name: in a code comment
  input: |
    // It really works.
    const x = 1
  format: ts
  want: |
    1:7:Newsroom.Adverbs:Filler adverb 'really': cut it or use a stronger verb.

- name: an adverb AIVocabulary also holds
  about: One word raises one alert, from AIVocabulary.
  input: It quietly works, genuinely, seamlessly and notably.
  absent: Newsroom.Adverbs

- name: a blockquote, every paragraph of it
  about: Claude writes most blockquotes itself, so the rules lint them.
  input: |
    > It really works — and it serves as a test, never a demo.
    >
    > The tell: the test breaks when you refactor, and it delves into the details.
  want: |
    1:6:Newsroom.Adverbs:Filler adverb 'really': cut it or use a stronger verb.
    1:19:Newsroom.EmDashes:Em dash overuse: use a period, comma, colon or parentheses.
    1:28:Newsroom.Copulatives:'serves as a' avoids "is": use "is", "are" or "has".
    1:44:Newsroom.NeverTag:Trailing "never X": cut it and keep the claim.
    3:3:Newsroom.BoldLabels:Label instead of a sentence: work 'The tell:' into the sentence.
    3:55:Newsroom.AIVocabulary:'delves' reads as AI: use a plainer word.

- name: a GitHub callout
  input: |
    > [!NOTE]
    > It really works.
  contains: Newsroom.Adverbs
