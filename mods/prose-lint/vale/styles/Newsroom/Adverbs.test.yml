- name: a filler adverb
  rule: Adverbs.yml
  input: It really works.
  want: |
    1:4:Newsroom.Adverbs:Adverb: cut 'really' and let the verb carry it.

- name: in a code comment
  input: |
    // It really works.
    const x = 1
  format: ts
  want: |
    1:7:Newsroom.Adverbs:Adverb: cut 'really' and let the verb carry it.

- name: an adverb AIVocabulary also holds
  about: One word raises one alert, from AIVocabulary.
  input: It quietly works, genuinely, seamlessly and notably.
  absent: Newsroom.Adverbs

- name: a blockquote, every paragraph of it
  about: Claude writes most blockquotes itself, so the rules lint them.
  input: |
    > It really works — and it serves as a test, never a demo.
    >
    > The tell: the test breaks when you refactor, and it delves into the details.
  want: |
    1:6:Newsroom.Adverbs:Adverb: cut 'really' and let the verb carry it.
    1:19:Newsroom.EmDashes:Overuse of em dashes: use a period, comma, colon or parentheses.
    1:28:Newsroom.Copulatives:Avoidance of basic copulatives: replace 'serves as a' with "is", "are" or "has".
    1:44:Newsroom.NeverTag:", never X" tag: state the behavior once and stop.
    3:3:Newsroom.BoldLabels:Bold label: fold 'The tell:' into the sentence it introduces.
    3:55:Newsroom.AIVocabulary:AI vocabulary: replace 'delves' with a plainer word.

- name: a GitHub callout
  input: |
    > [!NOTE]
    > It really works.
  contains: Newsroom.Adverbs
