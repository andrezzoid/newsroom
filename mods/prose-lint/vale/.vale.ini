# The bundled rules: the mod uses them only where neither the project nor the
# user has a .vale.ini of their own (see README.md).
#
# They are one style of our own, styles/Newsroom, and nothing to download.
# Each rule's test cases sit beside it in <Rule>.test.yml; run `vale test` in
# this folder after changing a rule, and noise/count.sh to see what it costs.
StylesPath = styles
MinAlertLevel = suggestion
# Vale's defaults, plus blockquotes: an alert on a quotation tells Claude to
# change someone else's words. A rule's own `scope: ~blockquote` misses every
# paragraph of a quote but the first.
SkippedScopes = script, style, pre, figure, blockquote

# Words in styles/config/vocabularies/Newsroom/accept.txt never trigger the
# rules that match words: AIVocabulary, Adverbs, Copulatives and Passive.
# Entries are case-sensitive regexes, hence the (?i) on each.
Vocab = Newsroom

# Vale reads only the comments of the code formats below, except shell
# scripts, which it reads whole. Formats left out (JSON, YAML, TOML) are data,
# and rst and adoc need rst2html or asciidoctor installed, or Vale fails on
# them. The mod's register.tsx keeps the same two lists, as DOCS and CODE.
[*.{md,mdx,markdown,txt,org,html}]
BasedOnStyles = Newsroom

[*.{c,h,cc,cpp,hpp,cs,css,go,java,kt,js,jsx,mjs,cjs,ts,tsx,lua,php,py,rb,rs,swift,scala,sh,bash,zsh}]
BasedOnStyles = Newsroom
# A doc comment describes state ("has been reaped", "is unverified"), which
# Passive reads as passive voice.
Newsroom.Passive = NO
