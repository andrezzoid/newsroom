# The bundled rules: the mod uses them only where neither the project nor the
# user has a .vale.ini of their own (see README.md).
#
# The mod runs `vale sync` to download the packages into styles/ when they're
# missing. It checks only that the folders exist, so after changing a version
# below, delete styles/AiTells and styles/write-good to get the new one.
StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/krishnasunkam/vale-ai-tells/releases/download/v1.0.0/AiTells.zip, \
  https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

# Words in styles/config/vocabularies/Software/accept.txt never trigger a
# rule. It lists software terms that write-good's TooWordy would otherwise
# flag ("implement", "allocate", "acquire a lock"). Entries are case-sensitive
# regexes, hence the (?i) on each.
Vocab = Software

# Vale reads only the comments of the code formats here, except shell scripts,
# which it reads whole. Formats left out (JSON, YAML, TOML) are data, and rst
# and adoc need rst2html or asciidoctor installed, or Vale fails on them.
[*.{md,mdx,markdown,txt,org,html,c,h,cc,cpp,hpp,cs,css,go,java,kt,js,jsx,mjs,cjs,ts,tsx,lua,php,py,rb,rs,swift,scala,sh,bash,zsh}]
BasedOnStyles = AiTells, write-good

# These target business and spec writing and misfire on technical prose:
# FilePath wants `SKILL.md` replaced by a "human title", WeakResume flags
# "involved in", CodeToken flags env var names. LinkText matches "this page"
# anywhere, link or not.
AiTells.FilePath = NO
AiTells.CodeToken = NO
AiTells.SectionCode = NO
AiTells.StatusBracket = NO
AiTells.WeakResume = NO
AiTells.LinkText = NO
# write-good's Passive catches irregular participles ("was written", "is run")
# that this one misses. Both flag "-ed" adjectives such as "is undefined".
AiTells.Passive = NO

# E-Prime flags every "is". Weasel shares "clearly", "obviously", "very" and
# "fairly" with AiTells' Adverb, so those words draw two alerts.
write-good.E-Prime = NO
