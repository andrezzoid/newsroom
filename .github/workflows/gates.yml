# Runs scripts/gates.sh, the same gates as .githooks/pre-commit, on every push
# and pull request, so a PR's check doesn't rest on the author's local hook.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # gates.sh needs Vale 3.24 or later; bump both lines together.
  VALE_VERSION: 3.24.0
  VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
  CLAUDE_CODE_VERSION: 2.1.301

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the claude CLI
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Install Vale
        run: |
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/errata-ai/vale/releases/download/v$VALE_VERSION/$tarball"
          echo "$VALE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run every gate
        run: sh scripts/gates.sh
